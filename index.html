<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.png = brand mark persegi; logo.png rasio 2:1 jadi kepotong kalau dipakai sebagai icon -->
    <link rel="icon" type="image/png" sizes="500x500" href="/favicon.png?v=4" />
    <link rel="apple-touch-icon" href="/favicon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO: title/description/canonical/og per halaman dikelola react-helmet-async di tiap route -->
    <title>Cozybytes Media | Jasa Pembuatan Website Profesional & Cepat</title>
    <meta name="author" content="Cozybytes Media" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph globals (Facebook, WhatsApp, LinkedIn).
         og:image & twitter:image TIDAK ditaruh di sini: tag statis selalu muncul lebih dulu
         daripada tag dari react-helmet-async, jadi crawler akan memakai gambar global dan
         gambar spesifik per halaman tidak pernah terpakai. Tiap halaman set sendiri. -->
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Cozybytes Media" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured Data: Local Business -->
